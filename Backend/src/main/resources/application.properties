spring.application.name=nimbus-core

#=========================================
#          Database Configuration
#=========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#=========================================
#          Connection Pool (HikariCP)
#=========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

#=========================================
#          JWT
#=========================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:600000}

#=========================================
#          CORS
#=========================================
# Empty = same-origin only (correct when served behind the bundled nginx).
# Comma-separated patterns, e.g. https://*.trycloudflare.com
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}

#=========================================
#          Actuator (health probe only)
#=========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.access.default=none
management.endpoint.health.access=read-only

#=========================================
#          HTTP
#=========================================
# Honour X-Forwarded-* from the nginx front end (needed for HSTS + real IPs)
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

server.port=8080
logging.level.org.springframework.security=INFO

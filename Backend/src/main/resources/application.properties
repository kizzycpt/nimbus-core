spring.application.name=nimbus-core

#=========================================
#          Database Configuration
#=========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#=========================================
#          Connection Pool (HikariCP)
#=========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

#=========================================
#          Sessions (browser auth)
#=========================================
# How long a session cookie stays valid. The window slides forward on every
# authenticated request, so this is an idle timeout, not a hard cap.
app.session.ttl-minutes=${APP_SESSION_TTL_MINUTES:720}

# Set true once a TLS front end is in place: it adds Secure to the session and
# CSRF cookies, so they are never sent over plain HTTP.
app.security.secure-cookies=${APP_SECURE_COOKIES:false}

# BCrypt work factor (log2 rounds). 12 is the modern default; drop to 10 on a
# low-power ARM board if logins feel sluggish. Never go below 10.
app.security.bcrypt-strength=${APP_BCRYPT_STRENGTH:12}

#=========================================
#          Customer sites (the hosting product)
#=========================================
# Where site files live inside the container. This is a bind mount pointed at
# the flash drive / data disk on the host — see NIMBUS_DATA_ROOT in .env.
app.sites.root=${APP_SITES_ROOT:/var/nimbus/sites}

# Storage sold per account, across all of their sites. Raise it per user in the
# database to upgrade someone without changing this default.
app.sites.default-quota-bytes=${APP_SITES_QUOTA_BYTES:104857600}

# Ceiling on a single upload. Keeps one bad file from eating a whole quota.
app.sites.max-file-bytes=${APP_SITES_MAX_FILE_BYTES:10485760}

# How many separate sites one account may provision.
app.sites.max-per-user=${APP_SITES_MAX_PER_USER:3}

# Multipart limits must sit above the per-file limit or Tomcat rejects the
# upload before the quota check ever runs.
spring.servlet.multipart.max-file-size=${APP_SITES_MAX_FILE_BYTES:10485760}
spring.servlet.multipart.max-request-size=${APP_SITES_MAX_FILE_BYTES:10485760}

#=========================================
#          JWT (bearer tokens for scripts/CI only)
#=========================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:600000}

#=========================================
#          CORS
#=========================================
# Empty = same-origin only (correct when served behind the bundled nginx).
# Comma-separated patterns, e.g. https://*.trycloudflare.com
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}

#=========================================
#          Actuator (health probe only)
#=========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.access.default=none
management.endpoint.health.access=read-only

#=========================================
#          HTTP
#=========================================
# Honour X-Forwarded-* from the nginx front end (needed for HSTS + real IPs)
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

server.port=8080
logging.level.org.springframework.security=INFO

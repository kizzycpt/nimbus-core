server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- hardening -------------------------------------------------------
  server_tokens off;
  add_header X-Content-Type-Options "nosniff"        always;
  add_header X-Frame-Options        "DENY"           always;
  add_header Referrer-Policy        "no-referrer"    always;
  add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Throttle credential endpoints (zones defined in nginx.conf http block).
  limit_req_status 429;

  client_max_body_size 64k;

  gzip on;
  gzip_types text/css application/javascript application/json;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ =404;
  }

  # --- API proxy to the backend container ------------------------------
  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout   30s;
  }

  # Stricter limits on auth endpoints.
  location = /api/login {
    limit_req zone=authlogin burst=10 nodelay;
    proxy_pass http://backend:8080/login;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/register {
    limit_req zone=authregister burst=5 nodelay;
    proxy_pass http://backend:8080/register;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- customer sites, path-routed --------------------------------------
  # Works with no DNS at all: http://<host>/s/<slug>/. Once you have a
  # wildcard record, 20-nimbus-sites.conf serves the same containers at
  # <slug>.sites.<domain>, which is the stronger isolation boundary.

  # Without the trailing slash, relative links inside the site would resolve
  # against /s/ instead of /s/<slug>/.
  location ~ "^/s/(?<slug>[a-z0-9][a-z0-9-]{1,30})$" {
    return 301 /s/$slug/;
  }

  location ~ "^/s/(?<slug>[a-z0-9][a-z0-9-]{1,30})/(?<siterest>.*)$" {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_upstream "nimbus-site-$slug";

    proxy_pass http://$site_upstream/$siterest$is_args$args;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Control-panel cookies must never reach a customer's container.
    proxy_set_header Cookie            "";

    proxy_connect_timeout 3s;
    proxy_read_timeout   15s;

    # No container for that slug means the site is not published, not that the
    # platform is broken.
    proxy_intercept_errors on;
    error_page 502 503 504 = @site_missing;

    # add_header in a location REPLACES the inherited set, so every header the
    # customer response needs has to be restated here.
    #
    # `sandbox` is the important one: it forces the document into an opaque
    # origin, so customer JavaScript cannot reach /api as same-origin and the
    # SameSite=Strict session cookie is never attached to its requests. Without
    # this, path-based hosting would hand every site owner an account-takeover
    # primitive against any logged-in visitor.
    add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-popups allow-modals allow-downloads" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "no-referrer" always;
  }

  location @site_missing {
    default_type text/html;
    return 404 '<!doctype html><meta charset="utf-8"><title>Not found</title><h1>404</h1><p>No site is published at this address.</p>';
  }

  # Never expose the actuator through the public front end.
  location /api/actuator { return 404; }

  location ~ /\. { deny all; }
}

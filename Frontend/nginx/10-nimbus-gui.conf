server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- hardening -------------------------------------------------------
  server_tokens off;
  add_header X-Content-Type-Options "nosniff"        always;
  add_header X-Frame-Options        "DENY"           always;
  add_header Referrer-Policy        "no-referrer"    always;
  add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Throttle credential endpoints (zones defined in nginx.conf http block).
  limit_req_status 429;

  client_max_body_size 64k;

  gzip on;
  gzip_types text/css application/javascript application/json;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ =404;
  }

  # --- API proxy to the backend container ------------------------------
  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout   30s;
  }

  # Stricter limits on auth endpoints.
  location = /api/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://backend:8080/login;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/register {
    limit_req zone=auth burst=3 nodelay;
    proxy_pass http://backend:8080/register;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Never expose the actuator through the public front end.
  location /api/actuator { return 404; }

  location ~ /\. { deny all; }
}

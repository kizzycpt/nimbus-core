# Main nginx config for the edge container.
#
# Same reason as the site containers: worker_processes is a main-context
# directive and the image ships `auto`, which means one worker per HOST core.
# On a 28-core box that is 28 workers to reverse-proxy one backend. Two is
# plenty for this role and keeps the container inside a small memory limit.

worker_processes 2;

error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 30;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}

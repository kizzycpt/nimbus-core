# Config for a single customer site container.
#
# Mounted read-only over the stock default.conf. Every site container runs this
# same file — the only thing that differs between them is which directory is
# mounted at /usr/share/nginx/html.
#
# This server is deliberately inert: it serves bytes and nothing else. No
# upstreams, no CGI, no PHP, no uploads, no directory listings.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    # A customer could otherwise upload a symlink pointing at anything visible
    # inside the container and have nginx serve it. Refuse to follow any.
    disable_symlinks on;

    # Static hosting: there is nothing here that should accept a request body.
    client_max_body_size 1k;
    client_body_buffer_size 1k;

    # Only the methods a static site needs.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        default_type text/html;
        return 404 '<!doctype html><meta charset="utf-8"><title>404</title><h1>404</h1><p>Page not found.</p>';
    }
}

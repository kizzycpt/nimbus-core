# Main nginx config for a customer site container.
#
# This replaces the image's /etc/nginx/nginx.conf outright, for one reason:
# worker_processes is a main-context directive, so it CANNOT be set from a
# conf.d snippet. The image ships `worker_processes auto`, which means one
# worker per host core — 28 of them on a 28-core box, for a container serving
# static files at 0.25 CPU.
#
# The image does have an autotune entrypoint script, but it works by rewriting
# nginx.conf with sed, and these containers run with a read-only rootfs. The
# write fails silently and the setting stays at `auto`. Shipping the value here
# is the only version that actually takes effect.

worker_processes 1;

# The rootfs is read-only and there is no log volume: log to the container's
# stdout/stderr so `docker logs` is the single place to look.
error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 30;
    server_tokens   off;

    # Static assets compress well and these are small files.
    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}

# Customer websites.
#
# Each site runs as its own container named nimbus-site-<slug>, created by
# site-reconciler.sh on the host and attached to the nimbus-core_sitenet
# network. Upstreams are resolved at request time through Docker's embedded DNS
# (127.0.0.11), so sites can be added and removed without ever reloading nginx.
#
# ---------------------------------------------------------------------------
# A NOTE ON ISOLATION, because path-based hosting has a real trap in it.
#
# Serving customer HTML under the same scheme://host:port as the control panel
# makes it same-origin with the app. Customer JavaScript could then fetch
# /api/me carrying a logged-in visitor's session cookie, read the CSRF token
# out of the response, and take over that account.
#
# Two things stop that here:
#   1. `Content-Security-Policy: sandbox` puts every customer document in an
#      opaque origin. Its requests to /api are then cross-origin, and the
#      SameSite=Strict session cookie is not attached to them.
#   2. Cookies are stripped before the request reaches the site container.
#
# The clean fix is a separate hostname, which the second server block below
# implements. Use it as soon as you have DNS — sandbox is a strong mitigation,
# but origin separation is the actual boundary.
# ---------------------------------------------------------------------------

# Applied to every customer response. Keep these together; add_header in a
# location replaces inherited headers rather than adding to them.
map $host $site_csp {
    default "sandbox allow-scripts allow-forms allow-popups allow-modals allow-downloads";
}

server {
    listen 80;
    # Only matches when a wildcard DNS record points here, e.g.
    #   *.sites.example.com -> this box
    # Until then this block is simply never selected, and /s/<slug>/ on the main
    # server handles routing instead.
    # Quoted: nginx would otherwise read the {1,30} repetition as a config block.
    server_name "~^(?<subdomain_slug>[a-z0-9][a-z0-9-]{1,30})\.sites\..+$";

    server_tokens off;
    client_max_body_size 1m;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $site_upstream "nimbus-site-$subdomain_slug";

        proxy_pass http://$site_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The site container has no business seeing control-panel cookies.
        proxy_set_header Cookie            "";

        proxy_connect_timeout 3s;
        proxy_read_timeout   15s;

        # A slug with no running container is a 404, not a 502.
        proxy_intercept_errors on;
        error_page 502 503 504 = @site_missing;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "no-referrer" always;
    }

    location @site_missing {
        default_type text/html;
        return 404 '<!doctype html><meta charset="utf-8"><title>Not found</title><h1>404</h1><p>No site is published here.</p>';
    }
}

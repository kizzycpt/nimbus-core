# Shared memory zones for throttling credential endpoints.
# 10m holds roughly 160k client IPs per zone.
#
# Login and registration get SEPARATE budgets on purpose. With one shared zone,
# a burst of sign-ups consumes the allowance that legitimate sign-ins need — and
# on a NAT'd network (an office, a school, a phone carrier) every user shares
# one $binary_remote_addr, so that runs out faster than you would expect.

# Sign-in: the endpoint worth brute-forcing. 10/min per IP is far below any
# useful cracking rate against BCrypt cost 12, while leaving room for a handful
# of people behind one address fumbling their passwords.
limit_req_zone $binary_remote_addr zone=authlogin:10m rate=10r/m;

# Registration: legitimate use is rare and bursty (one person, once). Keep it
# tight — this is the endpoint that fills your database with junk accounts.
limit_req_zone $binary_remote_addr zone=authregister:10m rate=5r/m;

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register - Nimbus</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <div class="brand"><span class="mono">Nimbus</span><span class="badge">Register</span></div>
      <div class="links">
        <a class="btn" href="/">Home</a>
        <a class="btn" href="/dashboard.html">Dashboard</a>
        <a class="btn" href="/login.html">Login</a>
        <button id="logoutBtn" class="btn btn-danger" hidden>Logout</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card card-form">
      <h2>Create account</h2>
      <p>Registers a new user via the Nimbus Core API.</p>

      <form id="registerForm" class="form">
        <input class="input" id="username" type="text" placeholder="Username" autocomplete="username" required />
        <input class="input" id="password" type="password" placeholder="Password" autocomplete="new-password" required />
        <button class="btn btn-primary" type="submit">Register</button>
      </form>

      <div id="toast" class="toast" hidden></div>
      <p class="small mt-12">
        Already have an account? <a class="mono" href="/login.html">Login</a>
      </p>
    </div>
  </div>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/register.js"></script>
</body>
</html>

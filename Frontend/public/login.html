<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Nimbus</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <div class="brand"><span class="mono">Nimbus</span><span class="badge">Login</span></div>
      <div class="links">
        <a class="btn" href="/">Home</a>
        <a class="btn" href="/dashboard.html">Dashboard</a>
        <a class="btn" href="/register.html">Register</a>
        <button id="logoutBtn" class="btn btn-danger" hidden>Logout</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card" style="max-width:520px;margin:0 auto;">
      <h2>Sign in</h2>
      <p>Uses your Nimbus Core API login endpoint.</p>

      <form id="loginForm" class="form">
        <input class="input" id="username" type="text" placeholder="Username" autocomplete="username" required />
        <input class="input" id="password" type="password" placeholder="Password" autocomplete="current-password" required />
        <button class="btn btn-primary" type="submit">Login</button>
      </form>

      <div id="toast" class="toast" hidden></div>
      <p class="small" style="margin-top:12px;">
        Need an account? <a class="mono" href="/register.html">Register</a>
      </p>
    </div>
  </div>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    document.querySelector("#logoutBtn").addEventListener("click", () => {
      clearToken();
      updateAuthUI();
      alert("Logged out.");
    });

    document.querySelector("#loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const toast = document.querySelector("#toast");

      const payload = {
        username: document.querySelector("#username").value.trim(),
        password: document.querySelector("#password").value
      };

      try {
        const res = await apiFetch("/login", {
          method: "POST",
          body: JSON.stringify(payload)
        });

        if (!res || !res.token) throw new Error("No token in response");
        saveToken(res.token);
        updateAuthUI();

        setToast(toast, "Logged in!", true);
        setTimeout(() => location.href = "/dashboard.html", 900);
      } catch (err) {
        setToast(toast, `Login failed: ${err.message}`, false);
      }
    });
  </script>
</body>
</html>
